[project]
name = "inkdeus"
version = "0.1.0"
description = "Browser-based editor that turns a color illustration into black-and-white manga-style line art with layered hatching (WebGL2)."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "flask>=3.0",
    "pillow>=10.0",
]

[project.scripts]
inkdeus = "inkdeus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "numpy>=1.26",
    "playwright>=1.45",
    "fonttools>=4.50",
    "pypdf>=6.20.0",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkdeus"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "inkdeus/web"
"patches" = "inkdeus/patches"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 既定で並列に回す（ワーカー数は tests/conftest.py。直列は -n 0）。同じファイルのテストは同じワーカーで順に回す
addopts = "-ra -n auto --dist loadgroup"
markers = [
    "ui: ブラウザ（ヘッドレス Chromium）を使うテスト（自動で付く）",
    "server: ブラウザを使わないテスト（自動で付く）",
    "manga: 実物の漫画エディタ（上流のクローン。INKDEUS_MANGA_SRC）が要る結合テスト",
    "slow: 1 本で何十秒もかかるテスト（-m \"not slow\" で外せる）",
]
