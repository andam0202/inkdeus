[project]
name = "inkdeus"
version = "0.1.0"
description = "Browser-based editor that turns a color illustration into black-and-white manga-style line art with layered hatching (WebGL2)."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "flask>=3.0",
    "pillow>=10.0",
]

[project.scripts]
inkdeus = "inkdeus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "numpy>=1.26",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkdeus"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "inkdeus/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
