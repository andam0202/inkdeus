<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inkdeus</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <span class="brand">inkdeus</span>
  <span id="projectName" title="プロジェクト" hidden></span>
  <button id="btnOpenImage" title="画像ファイルを選ぶ（画面へのドロップでも可）">画像を開く</button>
  <button id="btnOpenMask" title="人物マスク（白=人物）を選ぶ">マスクを開く</button>
  <input type="file" id="fileImage" accept="image/*" hidden>
  <input type="file" id="fileMask" accept="image/*" hidden>
  <input type="file" id="fileParams" accept=".json,application/json" hidden>
  <span id="nav" hidden>
    <button id="btnPrev" title="前の画像">◀</button>
    <select id="selImage" title="画像の一覧"></select>
    <button id="btnNext" title="次の画像">▶</button>
  </span>
  <span class="spacer"></span>
  <button id="btnUndo" title="取り消し (Ctrl+Z)">取り消し</button>
  <button id="btnRedo" title="やり直し (Ctrl+Y)">やり直し</button>
  <span id="saveState" class="dim"></span>
  <span id="modeBadge" class="badge"></span>
</header>
<main>
  <section id="viewer">
    <canvas id="gl"></canvas>
    <div id="splitHandle" hidden title="ドラッグで仕切りを動かす"></div>
    <div id="dropHint">
      <p>画像をここにドロップ、または「画像を開く」</p>
      <p class="dim">マスク（ファイル名に mask を含む画像）・設定JSON もドロップで読み込めます</p>
    </div>
    <div id="messages"></div>
    <div id="viewbar">
      <button id="btnFit">全体表示</button>
      <button id="btnActual">100%</button>
      <span id="zoomLabel">-</span>
      <button id="btnCompare" title="左右に分けて元画像と比べる">比較</button>
      <button id="btnOriginal" title="押している間だけ元画像（スペースキーでも可）">元画像</button>
      <span class="spacer"></span>
      <span id="busy" hidden>処理中…</span>
      <span id="timing" class="dim" title="1回の再描画にかかった時間"></span>
    </div>
  </section>
  <aside id="panel"></aside>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
